<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <base href="/" />

  <!-- Primary Meta Tags -->
  <title>JobHub — Discover Your Next Career Move</title>
  <meta name="description"
    content="JobHub is a modern job platform that connects professionals with curated career opportunities. Explore, apply, and grow your career with JobHub." />
  <meta name="author" content="Nidhal Gharbi" />
  <meta name="keywords"
    content="JobHub, jobs, careers, employment, hiring, recruitment, job board, work, freelance, internships, opportunities" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph / Social Media Meta -->
  <meta property="og:title" content="JobHub — Discover Your Next Career Move" />
  <meta property="og:description"
    content="Explore curated job offers and career opportunities across industries. Your next move starts here at JobHub." />

  <meta property="og:image" content="assets/og-preview.png" />

  <meta name="twitter:card" content="summary_large_image" />

    content="Find your dream job with JobHub. Browse jobs by role, experience, or industry and apply in one click." />
  <meta name="twitter:image" content="assets/og-preview.png" />

  <!-- Favicon & Icons -->
  <link rel="icon" type="image/x-icon" href="favicon.ico" />

  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png" />

  <!-- External Stylesheets -->
