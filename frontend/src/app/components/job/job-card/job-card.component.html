<div class="card h-100 shadow-sm job-card">
    <div class="card-body d-flex flex-column">
        <div class="d-flex justify-content-between align-items-start mb-2">
            <div>
                <h5 class="card-title mb-1">{{ job.title }}</h5>
                <p class="card-subtitle text-muted">
                    {{ job.company }} • {{ job.location }}
                </p>
            </div>
            <span class="badge" [ngClass]="{
          'bg-success': job.status === 'approved',
          'bg-warning text-dark': job.status === 'pending',
          'bg-danger': job.status === 'denied'
        }">
                {{ job.status | titlecase }}
            </span>
        </div>

        <p class="text-muted small mb-3">{{ job.description }}</p>

        <div class="d-flex flex-wrap gap-2 mb-3">
            <span class="badge bg-light text-dark border">{{
                job.type | titlecase
                }}</span>
            <span class="badge bg-light text-dark border">{{ job.industry }}</span>
            <span class="badge bg-light text-dark border">{{ job.experienceLevel | titlecase }} Level</span>
            <span class="badge bg-light text-dark border">{{ job.salary }}</span>
            <ng-container *ngFor="let tag of job.tags">
                <span class="badge bg-secondary">{{ tag }}</span>
            </ng-container>
        </div>

        <div class="mt-auto d-flex justify-content-between align-items-center">
            <div class="text-muted small">{{ job.applications }} applications</div>
            <button class="btn btn-outline-primary btn-sm" type="button" (click)="openDetails()">
                View Details
            </button>
        </div>
    </div>
</div>
