<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-semibold" routerLink="/">JobHub</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
            aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" routerLink="/" routerLinkActive="active"
                        [routerLinkActiveOptions]="{ exact: true }">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/about" routerLinkActive="active">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/contact" routerLinkActive="active">Contact</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/jobs" routerLinkActive="active">Job Board</a>
                </li>
                <li class="nav-item" *ngIf="user$ | async as user">
                    <a class="nav-link" [routerLink]="['/dashboard', user.role]" routerLinkActive="active">
                        Dashboard
                    </a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-3">
                <ng-container *ngIf="user$ | async as user; else loginLink">
                    <div class="text-end me-2">
                        <div class="text-white small">Welcome back</div>
                        <div class="fw-semibold text-white">{{ user.name }}</div>
                    </div>
                    <a class="btn btn-outline-light position-relative" [routerLink]="['/dashboard', 'notifications']">
                        <span class="me-2">Notifications</span>
                        <ng-container *ngIf="unreadCount$ | async as unread">
                            <span class="badge bg-warning text-dark" *ngIf="unread">
                                {{ unread }}
                            </span>
                        </ng-container>
                    </a>
                    <button class="btn btn-light" type="button" (click)="logout()">
                        Log out
                    </button>
                </ng-container>

                <ng-template #loginLink>
                    <div class="d-flex gap-2">
                        <a class="btn btn-outline-light" routerLink="/register">Register</a>
                        <a class="btn btn-light" routerLink="/login">Log in</a>
                    </div>
                </ng-template>
            </div>
        </div>
    </div>
</nav>
