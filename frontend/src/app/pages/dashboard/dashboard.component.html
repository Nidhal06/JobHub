<div class="container py-4">
    <div class="card border-0 shadow-sm mb-4" *ngIf="user as profile">
        <div class="card-body d-md-flex justify-content-between align-items-center gap-4">
            <div>
                <h2 class="h4 fw-semibold mb-1">Hello, {{ profile.name }}</h2>
                <p class="text-muted mb-0">
                    You are logged in as {{ profile.role | titlecase }}.
                </p>
            </div>
            <div class="text-muted small">
                <div>Email: {{ profile.email }}</div>
                <div *ngIf="profile.company">Company: {{ profile.company }}</div>
            </div>
        </div>
    </div>

    <ul class="nav nav-pills gap-2 mb-4 flex-wrap">
        <li class="nav-item" *ngFor="let item of navItems" [class.d-none]="!canView(item)">
            <a class="nav-link" [routerLink]="item.route" routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: item.route.length === 1 }">
                <div class="fw-semibold">{{ item.label }}</div>
                <small class="text-muted">{{ item.description }}</small>
            </a>
        </li>
    </ul>

    <router-outlet></router-outlet>
</div>
