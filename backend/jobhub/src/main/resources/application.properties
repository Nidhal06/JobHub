spring.application.name=jobhub

# ===============================
# SERVER
# ===============================
server.port=8081

# ===============================
# SUPABASE POSTGRESQL DATABASE (Session Pooler - IPv4)
# ===============================
spring.datasource.url=jdbc:postgresql://aws-1-eu-central-1.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.ikctqohomrkbfovfdnmb
spring.datasource.password=qjQcbqe5etG4PrAB
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool settings for Supabase
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=60000

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# JWT Configuration
# ===============================
jwt.secret=jobhub-secret-key-for-jwt-token-generation-must-be-at-least-256-bits-long-for-hs256
jwt.expiration=86400000

# ===============================
# CORS
# ===============================
cors.allowed-origins=http://localhost:4200
